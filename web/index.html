<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Still Here: an audio horror game built for VoiceOver and headphones.">
<title>Still Here</title>
<style>
  :root {
    --bg: #000;
    --text: #d8d0c4;
    --dim: #8a8178;
    --red: #c4161c;
    --btn: #120808;
    --btn-border: #5a1a1a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.2rem;
    line-height: 1.6;
    min-height: 100vh;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  main { max-width: 38rem; margin: 0 auto; padding: 2.5rem 0 4rem; }
  h1 {
    font-size: 2.6rem; letter-spacing: .25em; text-transform: uppercase;
    color: var(--red); margin: 0 0 .25rem; font-weight: normal;
    text-shadow: 0 0 18px rgba(196,22,28,.45);
  }
  h2 { font-size: 1.1rem; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); font-weight: normal; margin: 2rem 0 1rem; }
  #narration { white-space: pre-line; outline: none; min-height: 3em; }
  #narration:focus-visible { outline: 1px dashed var(--btn-border); outline-offset: 6px; }
  #choices { display: flex; flex-direction: column; gap: .8rem; margin-top: 2rem; }
  button {
    font: inherit; color: var(--text); background: var(--btn);
    border: 1px solid var(--btn-border); border-radius: 6px;
    padding: 1rem 1.2rem; text-align: left; cursor: pointer; min-height: 3.2rem;
  }
  button:hover, button:focus-visible { border-color: var(--red); outline: 2px solid var(--red); outline-offset: 2px; }
  body {
    background:
      radial-gradient(ellipse at 50% 30%, rgba(60, 8, 10, .35), transparent 60%),
      radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.9) 100%), var(--bg);
    background-attachment: fixed;
  }
  body::before {
    content: ""; position: fixed; inset: -50%; pointer-events: none; z-index: 0; opacity: .07;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 1.2s steps(6) infinite;
  }
  @keyframes grain { 0% { transform: translate(0,0); } 25% { transform: translate(-3%,2%); } 50% { transform: translate(2%,-3%); } 75% { transform: translate(-2%,-1%); } 100% { transform: translate(0,0); } }
  main { position: relative; z-index: 1; }
  @keyframes breathe { 0%, 100% { text-shadow: 0 0 14px rgba(196,22,28,.35); opacity: .9; } 50% { text-shadow: 0 0 34px rgba(196,22,28,.75); opacity: 1; } }
  body.menu h1 { animation: breathe 6s ease-in-out infinite; }
  body.splash h1 { font-size: clamp(2.6rem, 13vw, 5rem); margin-top: 18vh; text-align: center; letter-spacing: .3em; }
  body.splash #scene-title { text-align: center; }
  body.splash #narration { text-align: center; color: var(--dim); }
  body.splash #choices button { text-align: center; }
  body.menu #choices button { letter-spacing: .08em; }
  body.menu #choices button:first-child { border-color: var(--red); }
  .tagline { display: block; font-size: .95rem; letter-spacing: .35em; text-transform: uppercase; color: var(--dim); margin-top: .2rem; }
  .panel { display: flex; flex-direction: column; gap: 1.4rem; margin-top: 2rem; }
  .panel label { display: flex; flex-direction: column; gap: .5rem; color: var(--text); }
  .panel label.check { flex-direction: row; align-items: center; gap: .8rem; }
  .panel input[type=checkbox] { width: 1.5rem; height: 1.5rem; accent-color: var(--red); }
  .panel input[type=range] { width: 100%; accent-color: var(--red); height: 2rem; }
  .panel .val { color: var(--dim); font-size: .95rem; }
  #pause-btn { position: fixed; top: calc(env(safe-area-inset-top) + 10px); right: 16px; z-index: 5; padding: .5rem .9rem; min-height: 2.6rem; font-size: 1rem; background: rgba(18,8,8,.85); }
  body.menu #pause-btn, body.paused #pause-btn { display: none; }
  #pause { position: fixed; inset: 0; z-index: 10; background: #000; display: flex; align-items: flex-start; justify-content: center; padding: calc(env(safe-area-inset-top) + 3rem) 16px 2rem; overflow-y: auto; }
  #pause[hidden] { display: none; }
  #pause .box { width: 100%; max-width: 32rem; }
  #pause h2 { color: var(--red); font-size: 1.6rem; letter-spacing: .3em; margin-top: 0; outline: none; }
  #pause .buttons { display: flex; flex-direction: column; gap: .8rem; margin-top: 2rem; }
  @media (prefers-reduced-motion: reduce) { body::before, body.menu h1 { animation: none; } }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  #flash { position: fixed; inset: 0; background: var(--red); opacity: 0; pointer-events: none; transition: opacity 1.4s ease-out; }
  #flash.on { opacity: .85; transition: none; }
  body.dark main { opacity: .35; transition: opacity 3s; }
  @media (prefers-reduced-motion: reduce) { #flash { display: none; } }
</style>
</head>
<body>
<div id="flash" aria-hidden="true"></div>
<button type="button" id="pause-btn">Pause</button>
<div id="pause" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden>
  <div class="box">
    <h2 id="pause-title" tabindex="-1">Paused</h2>
    <div class="buttons">
      <button type="button" id="pause-resume">Resume</button>
      <button type="button" id="pause-restart">Restart from the last checkpoint</button>
      <button type="button" id="pause-quit">Quit to the main menu</button>
    </div>
    <div id="pause-panel" class="panel"></div>
  </div>
</div>
<main>
  <h1 id="game-title">Still Here<span class="tagline" id="tagline">An audio horror game</span></h1>
  <h2 id="scene-title"></h2>
  <p id="narration" tabindex="-1"></p>
  <div id="choices" role="group" aria-label="Choices"></div>
  <div id="panel" class="panel"></div>
  <p id="status" class="sr-only" aria-live="assertive"></p>
</main>

<script>
"use strict";

/* ---------- settings ---------- */
const opts = { extraTime: false, soft: false, hard: false, master: 1, musicVol: 1 };
try { Object.assign(opts, JSON.parse(localStorage.getItem("stillhere-opts") || "{}")); } catch (e) {}
function saveOpts() { try { localStorage.setItem("stillhere-opts", JSON.stringify(opts)); } catch (e) {} }
let done = [];
try { done = JSON.parse(localStorage.getItem("stillhere-done") || "[]"); } catch (e) {}
let endings = [], tapesFound = [];
try { endings = JSON.parse(localStorage.getItem("stillhere-endings") || "[]"); tapesFound = JSON.parse(localStorage.getItem("stillhere-tapes") || "[]"); } catch (e) {}
const ENDINGS = [
  ["alone", "Alone", "Chapter Two"], ["lockedin", "Locked In", "Chapter Three"], ["escape", "Escape", "Chapter Four"], ["shed", "The Shed", "Chapter Five"],
  ["together", "Together", "Chapter Twelve"], ["promise", "The Promise", "Chapter Twelve"], ["itwins", "It Wins", "Chapter Twelve"], ["silence", "Silence", "Chapter Twelve"],
  ["unrecorded", "Unrecorded", "Chapter Sixteen"], ["echo", "Echo", "Chapter Sixteen"],
];
function markEnding(id) { if (!endings.includes(id)) endings.push(id); try { localStorage.setItem("stillhere-endings", JSON.stringify(endings)); } catch (e) {} }
const TAPES = { t1: "The sheriff's case file", t2: "The girl, whispering", t3: "The DJ's private note", t4: "Walter's warning" };
function findTape(id) {
  if (!tapesFound.includes(id)) tapesFound.push(id);
  try { localStorage.setItem("stillhere-tapes", JSON.stringify(tapesFound)); } catch (e) {}
  say("Hidden tape found: " + TAPES[id] + ". " + tapesFound.length + " of 4.");
}
function hardOr(normal, hard) { return opts.hard ? hard : normal; }
function saveStory() { try { localStorage.setItem("stillhere-story", JSON.stringify({ toldTruth, closeness })); } catch (e) {} }
function markDone(n) {
  saveStory(); if (!done.includes(n)) done.push(n); try { localStorage.setItem("stillhere-done", JSON.stringify(done)); } catch (e) {} }

/* ---------- audio engine ---------- */
const SFX = ["awake","breath","comeout","creak","found","heart","hello","knock","neighbor","phone","scratch","scream","steps","stillhere",
  "jess_call","jess_code","jess_real","jess_car","me","thanks","jess_scream",
  "gravel0","gravel1","gravel2","tap0","tap1","glassbang","lock","unlock","keys","trunk","seat","rainloop","thunder",
  "news","j_incar","j_gas","j_lock","j_heard","j_made","j_hear",
  "trainhorn","trainhorn2","trainrumble","dooropen","c4_still","c4_plan","c4_walk","c4_gone","c4_fakejess","c4_alvarez","c4_you","news2",
  "vent0","vent1","vent2","conc0","conc1","conc2","doorclose",
  "i_cop1","i_cop2","i_cop3","i_cop4","i_disp1","i_disp2","i_disp3","i_r1","i_r2","i_r3","i_r4","i_r5","i_r6","i_r7","i_r8","i_r9","i_r10","i_r11","i_r12","i_r13","i_p1","i_j1","i_j2",
  "chop","c5_arrive","c5_aunt","c5_glad","c5_secret","c5_love","c5_storm","c5_fake","c5_deflect","c5_river","c5_sparrow","c5_lantern","c5_realknock","c5_shed","c5_together","c5_learning"];
const MUSIC = ["m_drone","m_chase","m_air","m_rest","m_gloom","m_child","m_ghost","m_gather","m_haze","m_volatile"];
let ctx, master, musicBus, buffers = {}, loaded = false, paused = false;
const active = new Set();
const musicEls = {}, musicGains = {};

function unlockAudio() {
  if (ctx) { ctx.resume(); return; }
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -4; comp.ratio.value = 6;
  master = ctx.createGain(); master.gain.value = opts.master;
  master.connect(comp); comp.connect(ctx.destination);
  // silent blip to unlock iOS
  const b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource();
  s.buffer = b; s.connect(ctx.destination); s.start(0);
  musicBus = ctx.createGain(); musicBus.gain.value = opts.musicVol; musicBus.connect(master);
  for (const m of MUSIC) {
    const el = new Audio("audio/" + m + ".mp3");
    el.loop = true; el.preload = "auto"; el.setAttribute("playsinline", "");
    const src = ctx.createMediaElementSource(el);
    const g = ctx.createGain(); g.gain.value = 0;
    src.connect(g); g.connect(musicBus);
    musicEls[m] = el; musicGains[m] = g;
    // start every track silently inside the tap, so iOS lets us fade them in later
    el.play().catch(() => {});
  }
  ctx.onstatechange = () => { if (ctx.state !== "running" && !paused) { say("Your device paused the sound. Tap anywhere to bring it back."); setTimeout(wakeAudio, 400); } };
}

function wakeAudio() {
  if (!ctx || paused) return;
  if (ctx.state !== "running") ctx.resume().catch(() => {});
  if (musicNow) for (const m of MUSIC) if (musicEls[m].paused) musicEls[m].play().catch(() => {});
}
["click", "touchend", "keydown"].forEach(ev => document.addEventListener(ev, wakeAudio, true));
window.addEventListener("focus", wakeAudio);
document.addEventListener("visibilitychange", () => { if (!document.hidden) wakeAudio(); });

async function loadOne(n) {
  const r = await fetch("audio/" + n + ".mp3");
  const ab = await r.arrayBuffer();
  buffers[n] = await new Promise((res, rej) => ctx.decodeAudioData(ab, res, rej));
}
async function loadSounds() {
  await Promise.all(SFX.map(loadOne));
  loaded = true;
}
// later chapters load their own voices on entry and free the previous chapter's, to keep phone memory down
const CH_SFX = {
  c6: ["c6_door","c6_box","c6_sheriff","c6_girl","c6_dj1","c6_dj2","c6_dj3","c6_walter1","c6_walter2","c6_jess","c6_end","t4"],
  c7: ["c7_jess1","c7_ruiz1","c7_djloop","c7_ruiz2","c7_jess2","c7_cr","t3","metalstep","c6_dj2"],
  c8: ["c8_nurse1","c8_alv1","c8_jessq","c8_alv2","c8_alv3","c8_jess2","c8_nurse2","c8_fakealv","c8_alv4","t1","metalstep"],
  z: ["i2_bro1","i2_ruiz1","i2_bro2","i2_kid","i2_disp","i2_ruiz2"],
  c9: ["c9_call1","c9_call2","c9_found","c9_ruiz","c9_crruiz","c9_mine"],
  c10: ["c10_jess1","c10_walter","c10_cr","c10_jess2","t2","metalstep","c6_dj2","c6_girl"],
  c11: ["c11_jess1","c11_jess2","c11_jess3","c11_cr"],
  c12: ["c12_jess1","c12_cr1","c12_crlove","c12_jesslove","c12_crdie","c12_jessalone","c12_ruiz","c12_news1","c12_news2","c12_jessend","c6_dj2","c6_girl","c9_crruiz","c8_fakealv","c11_cr"],
  c13: ["a13_moving","a13_asst","a13_lights","a13_ruiz","a13_quiet","a13_news","a13_call","plate"],
  c14: ["a14_twovoice","a14_safe","a14_alert","a14_glitch","a14_unlock","a14_jessunlock","a14_crunlock","a14_sang","c8_fakealv"],
  c15: ["a15_call","a15_doors","a15_danny","a15_keep","a15_letgo","a15_cr","c6_girl","c6_dj2","c6_walter1"],
  c16: ["a16_plan","a16_tower","a16_beg","a16_forget","a16_who","a16_say","a16_there","a16_ruizend","a16_news","a13_asst","a15_danny","c8_alv1","c11_cr"],
  tapes: ["t1","t2","t3","t4"],
};
const chLoaded = {};
function chapterKey(id) {
  const m = id.match(/^c(\d+)/);
  if (m && +m[1] >= 6) return "c" + m[1];
  if (id.startsWith("z")) return "z";
  if (id === "tapes") return "tapes";
  return null;
}
async function loadChapter(key) {
  for (const k in chLoaded) if (k !== key && k !== "tapes") { for (const n of CH_SFX[k]) delete buffers[n]; delete chLoaded[k]; }
  await Promise.all(CH_SFX[key].filter(n => !buffers[n]).map(loadOne));
  chLoaded[key] = true;
}

function makePanner(x, y, z) {
  const p = ctx.createPanner();
  p.panningModel = "HRTF"; p.distanceModel = "inverse";
  p.refDistance = 1; p.rolloffFactor = 1.2;
  setPos(p, x, y, z, 0);
  return p;
}
function setPos(p, x, y, z, rampSec) {
  if (p.positionX) {
    const t = ctx.currentTime;
    if (rampSec) {
      p.positionX.linearRampToValueAtTime(x, t + rampSec);
      p.positionY.linearRampToValueAtTime(y, t + rampSec);
      p.positionZ.linearRampToValueAtTime(z, t + rampSec);
    } else { p.positionX.setValueAtTime(x, t); p.positionY.setValueAtTime(y, t); p.positionZ.setValueAtTime(z, t); }
  } else p.setPosition(x, y, z);
}

// x: + right / - left, z: - in front / + behind. Units roughly metres.
function play(name, o = {}) {
  if (!ctx || !buffers[name]) return null;
  const src = ctx.createBufferSource();
  src.buffer = buffers[name];
  src.playbackRate.value = o.rate || 1;
  src.loop = !!o.loop;
  const g = ctx.createGain(); g.gain.value = o.gain == null ? 1 : o.gain;
  let node = src;
  if (o.lowpass) { const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = o.lowpass; node.connect(f); node = f; }
  if (o.phone) {
    const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 350;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3200;
    node.connect(hp); hp.connect(lp); node = lp;
  }
  node.connect(g);
  const p = makePanner(o.x || 0, o.y || 0, o.z == null ? -1 : o.z);
  g.connect(p); p.connect(master);
  const h = { src, gain: g, panner: p, keep: !!o.keep };
  active.add(h);
  src.onended = () => active.delete(h);
  src.start(ctx.currentTime + (o.delay || 0));
  if (o.to) setPos(p, o.to[0], o.to[1], o.to[2], o.toSec || 2);
  return h;
}
function stopAll(includeKeep) {
  for (const h of [...active]) {
    if (h.keep && !includeKeep) continue;
    try { h.src.stop(); } catch (e) {}
    active.delete(h);
  }
}

let musicNow = null;
function music(name, vol = 0.35, fade = 3) {
  if (!ctx) return;
  if ((name === "m_drone" || name === "m_air") && !document.body.classList.contains("menu")) vol = Math.max(vol, 0.13);
  musicNow = vol > 0 ? name : null;
  const t = ctx.currentTime;
  for (const m of MUSIC) {
    const g = musicGains[m].gain;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(m === name ? vol : 0, t + fade);
    if (m === name && musicEls[m].paused) musicEls[m].play().catch(() => {});
  }
}
function musicCut() {
  musicNow = null;
  if (!ctx) return;
  const t = ctx.currentTime;
  for (const m of MUSIC) { const g = musicGains[m].gain; g.cancelScheduledValues(t); g.setValueAtTime(0, t); }
}

/* synthesized sounds */
let noiseBuf;
function noise() {
  if (noiseBuf) return noiseBuf;
  noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return noiseBuf;
}
function tone(o) {
  const t = ctx.currentTime + (o.delay || 0);
  const osc = ctx.createOscillator(); osc.type = o.type || "sine";
  osc.frequency.setValueAtTime(o.f, t);
  if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t + o.dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(o.gain || 0.5, t + (o.attack || 0.01));
  g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
  const p = makePanner(o.x || 0, 0, o.z == null ? -1 : o.z);
  osc.connect(g); g.connect(p); p.connect(master);
  osc.start(t); osc.stop(t + o.dur + 0.05);
}
function drip(x) {
  tone({ f: 1500, f2: 380, dur: 0.12, gain: 0.6, x, z: -0.5 });
  tone({ f: 1400, f2: 360, dur: 0.12, gain: 0.15, x, z: -0.5, delay: 0.18 });
}
let heartTimer = null, heartBpm = 0;
function heartbeat(bpm) {
  heartBpm = bpm;
  if (heartTimer || !bpm) { if (!bpm) heartStop(); return; }
  const beat = () => {
    if (!heartBpm) return;
    if (paused) { heartTimer = setTimeout(beat, 300); return; }
    tone({ f: 70, f2: 35, dur: 0.22, gain: 0.9, z: 0.01 });
    tone({ f: 60, f2: 32, dur: 0.25, gain: 0.6, z: 0.01, delay: 0.24 });
    heartTimer = setTimeout(beat, 60000 / heartBpm);
  };
  beat();
}
function heartStop() { heartBpm = 0; clearTimeout(heartTimer); heartTimer = null; }
function buzz(times) {
  for (let i = 0; i < times; i++) {
    for (const k of [0, 0.5]) {
      const t0 = i * 1.6 + k;
      tone({ type: "sawtooth", f: 140, dur: 0.38, gain: 0.25, attack: 0.02, x: 0.6, z: -0.4, delay: t0 });
      tone({ type: "square", f: 70, dur: 0.38, gain: 0.12, attack: 0.02, x: 0.6, z: -0.4, delay: t0 });
    }
  }
}
function whoosh(x) {
  const s = ctx.createBufferSource(); s.buffer = noise();
  const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.2;
  const t = ctx.currentTime;
  f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(2500, t + 0.35); f.frequency.exponentialRampToValueAtTime(200, t + 0.8);
  const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(1.2, t + 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
  const p = makePanner(x, 0, -2); setPos(p, x, 0, 2, 0.9);
  s.connect(f); f.connect(g); g.connect(p); p.connect(master);
  s.start(t); s.stop(t + 1);
}
function boom() {
  tone({ f: 80, f2: 25, dur: 2.2, gain: 1, z: 0.01 });
  for (const f of [466, 494, 523, 740]) tone({ type: "sawtooth", f, f2: f * 0.94, dur: 1.6, gain: 0.08, z: -0.3 });
}
function chime() {
  tone({ f: 880, dur: 0.25, gain: 0.25, x: 0.5, z: -0.5 });
  tone({ f: 587, dur: 0.5, gain: 0.25, x: 0.5, z: -0.5, delay: 0.22 });
}
let birdTimer = null;
function birds(on) {
  clearTimeout(birdTimer);
  if (!on) return;
  const chirp = () => {
    if (paused) { birdTimer = setTimeout(chirp, 300); return; }
    const x = Math.random() * 8 - 4, base = 2400 + Math.random() * 1600, n = 2 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) tone({ f: base, f2: base * (1.3 + Math.random() * 0.4), dur: 0.08, gain: 0.08, x, z: -6, delay: i * 0.12 });
    birdTimer = setTimeout(chirp, 500 + Math.random() * 1800);
  };
  chirp();
}
function steps(count, o = {}) {
  // repeated footstep sample, optionally travelling from one point to another
  const from = o.from || [0, 0, -3], to = o.to || from, gap = o.gap || 0.8;
  for (let i = 0; i < count; i++) {
    const k = count > 1 ? i / (count - 1) : 0;
    const pos = from.map((v, j) => v + (to[j] - v) * k);
    play("steps", { x: pos[0], y: pos[1], z: pos[2], delay: i * gap, rate: (o.rate || 1) * (0.94 + Math.random() * 0.12), gain: o.gain || 1, lowpass: o.lowpass });
  }
}
function len(name) { return buffers[name] ? buffers[name].duration * 1000 : 3000; }
let rainNodes = null, engineNodes = null;

      s.loopStart = 0.06; s.loopEnd = buffers.rainloop.duration - 0.06;

function settingsPanel() {
  const wrap = document.createElement("div");
  wrap.className = "panel";
  const slider = (labelText, key, apply) => {
    const l = document.createElement("label");
    const span = document.createElement("span"); span.textContent = labelText;
    const r = document.createElement("input");
    r.type = "range"; r.min = 0; r.max = 100; r.step = 10; r.value = Math.round(opts[key] * 100);
    const v = document.createElement("span"); v.className = "val"; v.setAttribute("aria-hidden", "true");
    const sync = () => { const pct = r.value + " percent"; r.setAttribute("aria-valuetext", pct); v.textContent = pct; };
    r.addEventListener("input", () => { opts[key] = r.value / 100; apply(); sync(); saveOpts(); });
    r.addEventListener("change", () => { if (key === "master") drip(0); });
    sync(); l.append(span, r, v); return l;
  };
  const check = (labelText, key) => {
    const l = document.createElement("label"); l.className = "check";
    const c = document.createElement("input"); c.type = "checkbox"; c.checked = !!opts[key];
    c.addEventListener("change", () => { opts[key] = c.checked; saveOpts(); });
    const span = document.createElement("span"); span.textContent = labelText;
    l.append(c, span); return l;
  };
  wrap.append(
    slider("Master volume", "master", () => { if (master) master.gain.value = opts.master; }),
    slider("Music volume", "musicVol", () => { if (musicBus) musicBus.gain.value = opts.musicVol; }),
    check("Extra time for timed choices", "extraTime"),
    check("Quieter jump scares", "soft"),
    check("Hard mode: less time to react and fewer warnings", "hard"),
  );
  return wrap;
}

let round = 0, roundSide = 0, roundLive = false;
scene("s6", () => {
  round = 0;
  music("m_chase", 0.28, 4);
  show("The hallway", "The hallway is pitch black.\n\nSomething is coming back. Fast.\n\nListen for which side it comes from, then dodge the other way. If it comes from the left, dodge right. If it comes from the right, dodge left.\n\nThree times. Don't freeze.", [
    { label: "I'm ready", act: () => chaseRound() },
  ]);
}, true);
function chaseRound() {
  clearScene();
  round++; roundLive = false;
  roundSide = Math.random() < 0.5 ? -1 : 1;
  heartbeat(130);
  show("Round " + round + " of 3", "Listen.", [
    { label: "Dodge left", act: () => dodge(-1) },
    { label: "Dodge right", act: () => dodge(1) },
  ]);
  const cue = 1800 + Math.random() * 1500;
  after(cue, () => {
    roundLive = true;
    const x = roundSide * 3.5;
    steps(5, { from: [x, 0, -7], to: [x * 0.6, 0, -1.5], gap: 0.32, rate: 1.3 });
    play("breath", { x: x * 0.7, z: -3, delay: 0.6, gain: 1.3, rate: 0.85, to: [x * 0.5, 0, -1], toSec: 1.5 });
  });
  const limit = opts.extraTime ? 16000 : hardOr(9000, 5500);
  after(cue + limit, () => die("You froze.\n\nIt didn't."));
}
function dodge(side) {
  if (!roundLive) { say("Wait for the sound."); return; }
  if (side === roundSide) return die("You dodged the wrong way. Straight into it.");
  clearScene();
  whoosh(roundSide * 1.2);
  if (round < 3) {
    show("Close", "It rushes past you, so close you feel the air move.", [{ label: "Next", act: () => chaseRound() }]);
    after(3500, () => chaseRound());
  } else {
    heartbeat(100);
    show("Close", "It rushes past you and slams into the wall at the far end of the hall. Then nothing.\n\nYou keep moving. Hands on the wall. Feeling your way forward.", [
      { label: "Keep going", act: to("s7") },

  }
}

let radioNodes = null, wiperTimer = null, humNodes = null;
function radio(level) {
  if (!ctx) return;
  if (!radioNodes) {
    const s = ctx.createBufferSource(); s.buffer = noise(); s.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1800; bp.Q.value = 0.7;
    const g = ctx.createGain(); g.gain.value = 0;
    const p = makePanner(0.5, 0, -0.8);
    s.connect(bp); bp.connect(g); g.connect(p); p.connect(master); s.start();
    radioNodes = { g };
  }
  ramp(radioNodes.g.gain, level, 0.15);
}
function wipers(on) {
  clearInterval(wiperTimer); wiperTimer = null;
  if (!on) return;
  wiperTimer = setInterval(() => paused || tone({ f: 90, f2: 60, dur: 0.12, gain: 0.12, z: -1.2 }), 1300);
}
function hum(level) {
  if (!ctx) return;
  if (!humNodes) {
    const g = ctx.createGain(); g.gain.value = 0; g.connect(master);
    for (const [f, v] of [[120, 0.5], [240, 0.25], [360, 0.12]]) {
      const o = ctx.createOscillator(); o.frequency.value = f;
      const og = ctx.createGain(); og.gain.value = v; o.connect(og); og.connect(g); o.start();
    }
    humNodes = { g };
  }
  ramp(humNodes.g.gain, level, 1);
}
function shopChime(x) { tone({ f: 659, dur: 0.6, gain: 0.12, x, z: -7 }); tone({ f: 523, dur: 0.9, gain: 0.12, x, z: -7, delay: 0.35 }); }
function gravel(count, o) { // crunchy steps on gravel, travelling from one point to another
  const from = o.from, to = o.to, gap = o.gap || 0.55;
  for (let i = 0; i < count; i++) {
    const k = count > 1 ? i / (count - 1) : 0;
    play("gravel" + (i % 3), { x: from[0] + (to[0] - from[0]) * k, z: from[2] + (to[2] - from[2]) * k, delay: i * gap, gain: o.gain || 1, rate: 0.9 + Math.random() * 0.2 });
  }
}
function thunderSoon(ms) { after(ms, () => play("thunder", { z: -8, x: pick([-6, 6]), gain: 0.7 })); }
const offCar = () => { radio(0); wipers(false); hum(0); };

function siren(dur, from, to) {
  const t = ctx.currentTime;
  const o = ctx.createOscillator(); o.type = "square";
  const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1800;
  const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + 1); g.gain.setValueAtTime(0.07, t + dur - 1.5); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.frequency.setValueAtTime(650, t);
  for (let k = 0; k < dur / 1.2; k++) { o.frequency.linearRampToValueAtTime(1350, t + k * 1.2 + 0.6); o.frequency.linearRampToValueAtTime(650, t + k * 1.2 + 1.2); }
  const p = makePanner(from[0], from[1], from[2]); setPos(p, to[0], to[1], to[2], dur);
  o.connect(lp); lp.connect(g); g.connect(p); p.connect(master); o.start(t); o.stop(t + dur + 0.1);
}
function squelch(x = 0.4, z = -0.8) {
  const s = ctx.createBufferSource(); s.buffer = noise();
  const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 2400; f.Q.value = 1.5;
  const g = ctx.createGain(); const t = ctx.currentTime;
  g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
  const p = makePanner(x, 0, z);
  s.connect(f); f.connect(g); g.connect(p); p.connect(master); s.start(t); s.stop(t + 0.25);
  tone({ type: "square", f: 1200, dur: 0.04, gain: 0.08, x, z });
}
function buzzer() { tone({ type: "square", f: 120, dur: 0.6, gain: 0.12, x: 0, z: -2.5 }); }
function conc(count, o) {
  const from = o.from, to = o.to, gap = o.gap || 0.55;
  for (let i = 0; i < count; i++) {
    const k = count > 1 ? i / (count - 1) : 0;
    play("conc" + (i % 3), { x: from[0] + (to[0] - from[0]) * k, z: from[2] + (to[2] - from[2]) * k, delay: i * gap, gain: o.gain || 1, rate: 0.85 + Math.random() * 0.2 });
  }
}
function crawl(x, dur) { // something moving through the ceiling vents
  for (let i = 0; i < dur / 450; i++) {
    play(pick(["vent0", "vent1", "vent2"]), { x: x + Math.random() * 0.6 - 0.3, y: 2.4, z: -1.5 + i * 0.15, delay: i * 0.45 + Math.random() * 0.15, gain: 0.9, rate: 0.6 + Math.random() * 0.3, lowpass: 2500 });
    if (i % 3 === 0) play("scratch", { x, y: 2.4, z: -1.2, delay: i * 0.45, gain: 0.8, rate: 0.7, lowpass: 2500 });
  }
}

let windNodes = null, fireNodes = null, popTimer = null, ringTimer = null;
function wind(level) {
  if (!ctx) return;
  if (!windNodes) {
    const s = ctx.createBufferSource(); s.buffer = noise(); s.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 500;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.13;
    const lg = ctx.createGain(); lg.gain.value = 250; lfo.connect(lg); lg.connect(lp.frequency);
    const g = ctx.createGain(); g.gain.value = 0;
    s.connect(lp); lp.connect(g); g.connect(master); s.start(); lfo.start();
    windNodes = { g };
  }
  ramp(windNodes.g.gain, level, 2);
}
function fire(level) {
  if (!ctx) return;
  if (!fireNodes) {
    const s = ctx.createBufferSource(); s.buffer = noise(); s.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 700;
    const g = ctx.createGain(); g.gain.value = 0;
    const p = makePanner(0.8, -0.3, -1.6);
    s.connect(lp); lp.connect(g); g.connect(p); p.connect(master); s.start();
    fireNodes = { g, level: 0 };
  }
  fireNodes.level = level;
  ramp(fireNodes.g.gain, level * 0.25, 2);
  clearTimeout(popTimer);

function playReversed(name, o) { // the creature playing a voice backwards
  const src = buffers[name]; if (!src) return;
  const key = name + "_rev";
  if (!buffers[key]) {
    const b = ctx.createBuffer(src.numberOfChannels, src.length, src.sampleRate);
    for (let c = 0; c < src.numberOfChannels; c++) { const s = src.getChannelData(c), d = b.getChannelData(c); for (let i = 0; i < s.length; i++) d[i] = s[s.length - 1 - i]; }
    buffers[key] = b;
  }
  play(key, o);
}

}

function tuneChoices() {
  return [
    { label: "Turn the dial down", act: () => tuneTo(dial - 5) },
    { label: "Turn the dial up", act: () => tuneTo(dial + 5) },
    { label: "Check the dial", act: () => say("The dial is at " + dial + ". Found " + foundStations.length + " of 3.") },
  ];
}
function tuneTo(v) {
  dial = Math.max(0, Math.min(100, v));
  let best = 999, bi = -1;
  targets.forEach((t, i) => { if (!foundStations.includes(i)) { const d = Math.abs(t - dial); if (d < best) { best = d; bi = i; } } });
  tone({ type: "square", f: 300 + dial * 6, dur: 0.03, gain: 0.05, x: 0.4, z: -0.6 });
  if (best === 0) {
    foundStations.push(bi);
    radio(0.01);
    clearScene();
    const st = STATIONS[foundStations.length - 1];
    play(st.clip, { x: 0.4, z: -0.6, phone: true, gain: 1.6 });
    after(len(st.clip) + 600, () => {
      radio(0.12);
      if (foundStations.length === 3) { radio(0); go("c7stairs"); return; }
      show("The radio", "Dial " + dial + ". " + st.text + "\n\nFound " + foundStations.length + " of 3. Keep turning.", tuneChoices());
    });
    return;
  }
  radio(best <= 10 ? 0.05 : best <= 20 ? 0.08 : 0.12);
  if (best <= 10 && bi >= 0) play(STATIONS[foundStations.length].clip, { x: 0.4, z: -0.6, phone: true, gain: best <= 5 ? 0.5 : 0.25, lowpass: 1200 });
  say("Dial " + dial + (best <= 10 ? ". Something's there, close." : best <= 20 ? ". The static thins." : "."));
}

let usedMic = false;
async function recordVoice(ms) {
  try { if (navigator.audioSession) navigator.audioSession.type = "play-and-record"; } catch (e) {}
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const rec = new MediaRecorder(stream);
  const chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  const done = new Promise(res => rec.onstop = res);
  rec.start();
  await new Promise(r => setTimeout(r, ms));
  rec.stop(); await done;
  stream.getTracks().forEach(t => t.stop());
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  const ab = await new Blob(chunks, { type: rec.mimeType }).arrayBuffer();
  buffers.myvoice = await new Promise((res, rej) => ctx.decodeAudioData(ab, res, rej));
  delete buffers.myvoice_rev;
}

    { label: "Let Jess talk to him", act: async () => {
      clearScene(); listening();
      await say2("a15_letgo", { x: -0.5, z: -0.5, gain: 1.2 }, 2500);
      play("trunk", { x: 0.3, z: -1, gain: 0.8, rate: 0.5, lowpass: 1500 }); fire(1);
      await wait(4000); fire(0.6);
      dannyKept = false; go("c15end");
    } },
  ]);
});
scene("c15end", async () => {
  listening();
  await wait(2000);
  await say2("a15_cr", { x: 0.3, z: -1, gain: 1.4, lowpass: 4000 });
  markDone(17); saveStory();
  try { localStorage.setItem("stillhere-danny", dannyKept ? "1" : "0"); } catch (e) {}
  silenceAll();
  show("End of Chapter Fifteen", (dannyKept ? "Ruiz puts Danny's tape in his shirt pocket, over his heart. He doesn't say thank you. He doesn't have to.\n\n" : "Jess takes his hand. “He was your brother, Tommy. Not its. Let him go.” For a long time, Ruiz just holds the tape. Then he drops it into the fire himself.\n\n") + "From the flames, the creature's whisper, amused: “You can't burn all of them. You recorded yourselves.”\n\nYour phones. Every voice message you ever sent. It's right.", [
    { label: "Play Chapter Sixteen: Unrecorded", act: to("c16") },
    { label: "Main menu", act: to("title") },
  ]);
});

/* chapter sixteen: unrecorded */
const DELETE = [
  ["c8_alv1", "Delete: voicemails from Mrs. Alvarez", "Mrs. Alvarez's voice, one last time: “Jessica? Is that you, mija?” Then nothing."],
  ["i_r13", "Delete: voice messages from Ruiz", "Ruiz, from months ago: “There's a cabin. My brother's.” Cut off mid-word."],
  ["c5_love", "Delete: every voice message from Jess", "Jess, by the fire, so long ago: “I love you. I know that's crazy.” Jess, beside you now, closes her eyes as it disappears."],
  ["a13_asst", "Delete: the smart speaker's voice history", "The cheerful assistant: “Hi there! I'm all set up.” A year of everything you ever said to it, gone."],
];
let delIdx = 0;
scene("c16", async () => {
  try { dannyKept = localStorage.getItem("stillhere-danny") === "1"; } catch (e) {}
  if (!buffers.myvoice) buffers.myvoice = buffers.me;
  silenceAll(); music("m_gloom", 0.12, 5); city(0.02); heartbeat(0);
  listening();
  await wait(2000);
  await say2("a16_tower", { x: 0.4, z: -0.4, phone: true, gain: 1.4 }, 900);
  await say2("a16_plan", { x: -0.4, z: -0.3, gain: 1.2 });
  delIdx = 0;
  show("Chapter Sixteen: Unrecorded", "That night. Ruiz, on speakerphone: “I got the cell tower shut down. One hour of silence. That's all I could buy you.”\n\nJess sits beside you on the floor with both your phones and her laptop.\n\n“Our phones. The cloud. Every voice message we ever sent. We delete everything. Together. Tonight.”\n\nEvery recording you delete, it will play one last time. Don't stop.", [
    { label: "Start deleting", act: delNext },
  ]);
}, true);
function delNext() {
  clearScene();
  if (delIdx >= DELETE.length) return go("c16last");
  const [clip, label] = DELETE[delIdx];
  heartbeat(100 + delIdx * 8);
  show("Deleting", delIdx === 0 ? "The first one." : "Next.", [{ label, act: () => delDo() }]);
}
async function delDo() {
  const [clip, , text] = DELETE[delIdx++];
  clearScene(); listening();
  play(clip, { x: 0.3, z: -0.4, phone: true, gain: 1.4 });
  await wait(Math.min(len(clip), 4500));
  stopAll(); tone({ f: 500, f2: 80, dur: 0.4, gain: 0.15, x: 0.3, z: -0.4 });
  await wait(1200);
  if (delIdx === 2) { await say2("a16_beg", { z: -2, gain: 1.4 }, 600); }
  if (delIdx === 3) { await say2("a16_forget", { x: 1.2, z: -1, gain: 1.3 }, 600); }
  show("Deleting", text + (delIdx === 2 ? "\n\nFrom every dead speaker at once: “Don't. Please. I'll be good. I'll only use one voice.”" : delIdx === 3 ? "\n\nThen Jess's voice, from across the room, where Jess isn't: “If you delete me, you'll forget how I sound.”" : ""), [{ label: "Keep going", act: delNext }]);
}
scene("c16last", async () => {
  heartbeat(130);
  listening();
  await wait(2000);
  play("myvoice", { x: 0.3, z: -0.4, phone: true, gain: 1.4 });
  await wait(len("myvoice") + 900);
  await say2("a16_who", { z: -1, gain: 1.3 });
  show("The last recording", "One recording left. It's on your phone. You know which one.\n\nYour voice. " + (usedMic ? "Your real voice, the one you whispered in the mine." : "The voice it stole from you in the mine.") + "\n\nFrom everywhere and nowhere, fading: “Wait. If I'm gone... who will remember you?”\n\n" + (usedMic ? "If you choose to delete it, the game really will delete your recording now." : "Deleting it here means it's gone for good."), [
    { label: "Delete my voice", act: to("c16unrecorded") },
    { label: "Keep it. Just this one.", act: to("c16echo") },
  ]);
}, true);
scene("c16unrecorded", async () => {
  delete buffers.myvoice; delete buffers.myvoice_rev; usedMic = false;
  silenceAll(); heartbeat(0);
  listening();
  tone({ f: 500, f2: 60, dur: 0.8, gain: 0.15, x: 0.3, z: -0.4 });
  await wait(9000);
  await say2("a16_say", { x: -0.3, z: -0.1, gain: 1.2 });
  show("Silence", "Deleted.\n\nAnd then: nothing. Not a hum, not a whisper. The kind of silence you've been afraid of for months, except this time it's empty. Really empty.\n\nJess is crying and smiling at the same time. “Say something. Anything. I just want to hear it the real way.”", [
    { label: "Say something to her", act: async () => {
      clearScene(); listening();
      await wait(2500);
      await say2("a16_there", { x: -0.3, z: -0.1, gain: 1.2 }, 1500);
      music("m_rest", 0.2, 6); birds(true);
      await wait(2000);
      await say2("a16_news", { x: 1, z: -2, gain: 1.1, lowpass: 5000 }, 1200);
      if (!dannyKept) await say2("a16_ruizend", { x: 0.4, z: -0.3, phone: true, gain: 1.3 }, 1500);
      else { await wait(3000); play("a15_danny", { x: 0.4, z: -0.3, phone: true, gain: 1.2, rate: 0.85, lowpass: 2500 }); await wait(len("a15_danny") / 0.85 + 1500); }
      markEnding("unrecorded"); markDone(18);
      silenceAll();
      show("Ending: Unrecorded", "You say it out loud, in your own voice, the real way. She laughs through her tears. “There you are.”\n\nA week later, on the news: “In Elk Ridge, those strange voicemails have stopped. Residents say their phones have been quiet all week. Just quiet.”\n\n" + (dannyKept ? "But two hundred miles away, at 2 a.m., in a shirt pocket in a dark bedroom, an old cassette clicks on by itself. A little boy, singing, slower than he ever sang: “Twinkle, twinkle, little star...”\n\nIt only ever needed one." : "Ruiz calls you a month later. “I don't remember exactly how Danny sounded anymore. I think that's okay. I remember him.”") + "\n\nThank you for playing Still Here.", [
        { label: "Endings found: " + endings.length + " of " + ENDINGS.length, act: to("endings") },
        { label: "Credits", act: to("credits") },
        { label: "Main menu", act: to("title") },
      ]);
    } },
  ]);
});
scene("c16echo", async () => {
  silenceAll(); heartbeat(0);
  listening();
  await wait(4000);
  music("m_rest", 0.12, 6);
  await wait(4000);
  play("myvoice", { x: 4, z: -2, gain: 1.1, lowpass: 3000 });
  await wait(len("myvoice") + 1200);
  await say2("c11_cr", { x: 4, z: -2, gain: 1.2 }, 1500);
  markEnding("echo"); markDone(18);
  silenceAll();
  show("Ending: Echo", "You keep it. Just the one. Your own voice. That can't hurt anyone.\n\nThe voicemails stop. The speakers stay quiet. Months go by. You're happy. Jess is happy.\n\nThen one evening, cooking dinner, you hear yourself laugh in the next room. Jess is sitting right next to you. She heard it too.\n\nFrom the next room, in your voice, delighted: “Thank you for the voice.”\n\nIt only ever needed one.", [
    { label: "Try again from the last checkpoint", act: () => go(checkpoint) },
    { label: "Main menu", act: to("title") },
  ]);
});

scene("credits", () => {
  show("Credits", CREDITS, [{ label: "Back", act: to("title") }]);
});

/* ---------- pause menu ---------- */
const pauseEl = document.getElementById("pause"), mainEl = document.querySelector("main");
function openPause() {
  if (paused || document.body.classList.contains("menu")) return;
  paused = true;
  pending.forEach(r => { clearTimeout(r.id); r.left = Math.max(0, r.due - Date.now()); });
  if (ctx) ctx.suspend();
  document.body.classList.add("paused");
  mainEl.inert = true; mainEl.setAttribute("aria-hidden", "true");
  document.getElementById("pause-panel").replaceChildren(settingsPanel());
  pauseEl.hidden = false;
  document.getElementById("pause-title").focus();
}
function closePause(resumeTimers) {
  paused = false;
  if (ctx) ctx.resume();
  if (resumeTimers) pending.forEach(r => { r.due = Date.now() + r.left; r.id = setTimeout(r.run, r.left); });
  document.body.classList.remove("paused");
  mainEl.inert = false; mainEl.removeAttribute("aria-hidden");
  pauseEl.hidden = true;
}
document.getElementById("pause-btn").addEventListener("click", openPause);
document.getElementById("pause-resume").addEventListener("click", () => { closePause(true); narrEl.focus(); });
document.getElementById("pause-restart").addEventListener("click", () => { closePause(false); go(checkpoint || "s1"); });
document.getElementById("pause-quit").addEventListener("click", () => { closePause(false); go("title"); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (paused) { closePause(true); narrEl.focus(); } else openPause();
});

go("splash");
</script>
