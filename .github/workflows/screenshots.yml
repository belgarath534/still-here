name: App Store screenshots
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project StillHere.xcodeproj -scheme StillHere -configuration Debug \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
      - name: Take screenshots
        run: |
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 16 Pro Max" | head -1 | grep -oE "[0-9A-F-]{36}")
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl ui "$DEV" appearance dark
          APP=$(find build/Build/Products -name "StillHere.app" | head -1)
          xcrun simctl install "$DEV" "$APP"
          mkdir -p shots
          n=1
          for s in splash title knock door radio pause; do
            xcrun simctl launch "$DEV" com.stillhere.horror -shot $s
            case $s in knock) sleep 16;; door) sleep 14;; *) sleep 8;; esac
            xcrun simctl io "$DEV" screenshot "shots/$n-$s.png"
            xcrun simctl terminate "$DEV" com.stillhere.horror || true
            n=$((n+1))
          done
          ls -la shots
      - name: Save them on the screenshots branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan screenshots
          git rm -rf --cached . > /dev/null
          git add shots
          git commit -m "Screenshots"
          git push -f origin screenshots
