name: iPhone build check
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Play-test every chapter (fast, no sound)
        run: swift run StillHereSim
      - name: Build the app for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -project StillHere.xcodeproj \
            -scheme StillHere \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
