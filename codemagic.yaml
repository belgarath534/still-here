# Still Here, native iPhone version.
# Start "Still Here check" first: it play-tests every chapter and builds the app without signing.
# "Still Here TestFlight" signs the app and uploads it to App Store Connect.
workflows:
  still-here-setup:
    name: Still Here setup (one time, registers the app ID with Apple)
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: Accessible Backrooms
    scripts:
      - name: Register com.stillhere.horror
        script: |
          if app-store-connect bundle-ids list --bundle-id-identifier com.stillhere.horror --strict-match-identifier | grep -q com.stillhere.horror; then
            echo "Already registered"
          else
            app-store-connect bundle-ids create com.stillhere.horror --name "Still Here" --platform IOS
          fi

  still-here-check:
    name: Still Here check (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 27.1
    scripts:
      - name: Play-test every chapter (fast, no sound)
        script: |
          swift run StillHereSim
      - name: Build the app for iPhone (unsigned)
        script: |
          set -o pipefail
          xcodebuild \
            -project StillHere.xcodeproj \
            -scheme StillHere \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee /tmp/xcodebuild.log | grep -E "error:|warning: .*StillHere|BUILD (SUCCEEDED|FAILED)"
    artifacts:
      - /tmp/xcodebuild.log

  still-here-testflight:
    name: Still Here TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Accessible Backrooms
    environment:
      xcode: 27.1
      ios_signing:
        # Codemagic needs one stored profile here to install the signing certificate;
        # the Still Here profile itself is downloaded from Apple in the first step.
        provisioning_profiles:
          - Dungeon Descent Live Activity App Store
        certificates:
          - Accessible Backrooms Distribution
    scripts:
      - name: Get the App Store profile from Apple
        script: |
          # Uses the App Store Connect key from the integration above.
          DEST="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DEST"
          app-store-connect profiles list --type IOS_APP_STORE --state ACTIVE \
            --name "Still Here App Store" --save --profiles-dir "$DEST"
          ls "$DEST"
      - name: Use the App Store signing profiles
        script: |
          xcode-project use-profiles
      - name: Set build number
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" StillHere.xcodeproj/project.pbxproj
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project StillHere.xcodeproj \
            --scheme StillHere
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
